name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag, the package and the plugin name one version
        run: |
          tag=${GITHUB_REF_NAME#v}
          package=$(python -c "import agent_comment_lint; print(agent_comment_lint.__version__)")
          plugin=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$tag" = "$package" && test "$tag" = "$plugin"
      - run: python -m unittest discover -s tests
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
