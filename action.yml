name: agent-comment-lint
description: Judge code comments against the agent-comment-lint rules. Fails on violations and on anything it cannot scan.
branding:
  icon: message-square
  color: gray-dark
inputs:
  mode:
    description: diff (changed lines since the base) or all (every covered file).
    default: diff
  base:
    description: The ref --diff compares against. Defaults to the pull request's target branch.
    default: ""
  args:
    description: Extra arguments, such as --config path/to/settings.json.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE: ${{ inputs.base }}
        ARGS: ${{ inputs.args }}
        TARGET: ${{ github.base_ref }}
      run: |
        set -u
        script="$GITHUB_ACTION_PATH/check-agent-comment-lint.py"
        case "$MODE" in
          all) exec python3 "$script" --all $ARGS ;;
          diff)
            base=${BASE:-${TARGET:+origin/$TARGET}}
            [ -n "$base" ] || { echo "agent-comment-lint: set the base input outside a pull request" >&2; exit 2; }
            exec python3 "$script" --diff "$base" $ARGS ;;
          *) echo "agent-comment-lint: mode must be diff or all, not $MODE" >&2; exit 2 ;;
        esac
