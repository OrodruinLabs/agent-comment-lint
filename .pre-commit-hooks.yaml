# The first id judges whole staged files, so old findings need fixing first; the -staged id only staged lines.
- id: agent-comment-lint
  name: agent-comment-lint
  entry: agent-comment-lint --files
  language: python
  pass_filenames: true
  files: (\.(cs|ts|tsx|mts|cts|js|jsx|mjs|cjs|css|sh|ya?ml|tf|tfvars|hcl|py|rb|rake|gemspec|toml|dockerfile)|(^|/)(Gemfile|Rakefile|Dockerfile|Containerfile))$
- id: agent-comment-lint-staged
  name: agent-comment-lint (staged lines)
  entry: agent-comment-lint --staged
  language: python
  pass_filenames: false
  files: (\.(cs|ts|tsx|mts|cts|js|jsx|mjs|cjs|css|sh|ya?ml|tf|tfvars|hcl|py|rb|rake|gemspec|toml|dockerfile)|(^|/)(Gemfile|Rakefile|Dockerfile|Containerfile))$
